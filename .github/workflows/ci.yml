name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgo
          POSTGRES_PASSWORD: sgo
          POSTGRES_DB: sgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgo -d sgo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sgo:sgo@localhost:5432/sgo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:check
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:types
      - name: tipos de la api al dia
        run: git diff --exit-code -- src/lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: preparar entorno
        run: |
          cp .env.example .env
          sed -i "s/cambiar_esta_clave/$(openssl rand -hex 16)/g" .env
      - run: docker compose up -d --build --wait
      - name: health a traves del proxy
        run: curl -ksf https://localhost/api/health
      - name: logs si falla
        if: failure()
        run: docker compose logs --no-color
