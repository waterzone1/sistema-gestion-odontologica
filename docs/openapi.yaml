openapi: 3.1.0
info:
  title: Sistema de Gestión Odontológica - API
  version: 0.2.0
  description: API REST del backend. Se autentica con una cookie de sesión
    HttpOnly. Las escrituras requieren el header Origin de la aplicación y el
    token CSRF de la sesión. Los errores siguen el formato ErrorBody.
servers:
  - url: /
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Usuarios
  - name: Sedes
  - name: Profesionales
  - name: Pacientes
  - name: Prácticas
  - name: Turnos
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Cookie de sesión HttpOnly que emite el login o el setup inicial
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token de la sesión (viene en la respuesta de login y de /auth/me).
        Las escrituras también exigen el header Origin de la app.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: degraded si alguna dependencia no responde
        db:
          type: string
          enum:
            - up
            - down
        uptimeSeconds:
          type: integer
          minimum: 0
      required:
        - status
        - db
        - uptimeSeconds
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: APPOINTMENT_CONFLICT
            message:
              type: string
              example: El profesional ya tiene un turno en ese horario
            details: {}
          required:
            - code
            - message
      required:
        - error
    SetupStatus:
      type: object
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
    SessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrfToken:
          type: string
          description: Enviar en el header X-CSRF-Token en toda escritura
      required:
        - user
        - csrfToken
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
            enum:
              - users:manage
              - branches:manage
              - professionals:manage
              - professionals:read
              - patients:read
              - patients:write
              - practices:read
              - practices:manage
              - appointments:read
              - appointments:manage
              - appointments:attend
              - clinical:read
              - clinical:write
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        mustChangePassword:
          type: boolean
        onboardingCompleted:
          type: boolean
      required:
        - id
        - username
        - displayName
        - roles
        - permissions
        - branchIds
        - mustChangePassword
        - onboardingCompleted
    Role:
      type: string
      enum:
        - ADMIN
        - DENTIST
        - RECEPTIONIST
    SetupInput:
      type: object
      properties:
        setupToken:
          type: string
          minLength: 1
          maxLength: 200
        organization:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            timezone:
              type: string
              default: America/Argentina/Buenos_Aires
          required:
            - name
        branch:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            address:
              type:
                - string
                - "null"
              maxLength: 200
            phone:
              type:
                - string
                - "null"
              maxLength: 200
          required:
            - name
        admin:
          type: object
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 64
              pattern: ^[a-z0-9._-]+$
            displayName:
              type: string
              minLength: 2
              maxLength: 120
            password:
              type: string
              maxLength: 256
          required:
            - username
            - displayName
            - password
      required:
        - setupToken
        - organization
        - branch
        - admin
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - username
        - password
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          maxLength: 256
      required:
        - currentPassword
        - newPassword
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        professional:
          $ref: "#/components/schemas/ProfessionalSummary"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - displayName
        - active
        - mustChangePassword
        - roles
        - branchIds
        - professional
        - createdAt
    ProfessionalSummary:
      type:
        - object
        - "null"
      properties:
        licenseNumber:
          type: string
        specialty:
          type:
            - string
            - "null"
        active:
          type: boolean
      required:
        - licenseNumber
        - specialty
        - active
    CreateUserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9._-]+$
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        password:
          type: string
          maxLength: 256
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
          maxItems: 3
        branchIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          default: []
      required:
        - username
        - displayName
        - password
        - roles
    UpdateUserInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
          maxItems: 3
        branchIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
    ResetPasswordInput:
      type: object
      properties:
        password:
          type: string
          maxLength: 256
      required:
        - password
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        active:
          type: boolean
      required:
        - id
        - name
        - address
        - phone
        - active
    CreateBranchInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        phone:
          type:
            - string
            - "null"
          maxLength: 200
      required:
        - name
    UpdateBranchInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        phone:
          type:
            - string
            - "null"
          maxLength: 200
        active:
          type: boolean
    Professional:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        licenseNumber:
          type: string
        specialty:
          type:
            - string
            - "null"
        active:
          type: boolean
        branchIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - id
        - userId
        - displayName
        - licenseNumber
        - specialty
        - active
        - branchIds
    SaveProfessionalInput:
      type: object
      properties:
        licenseNumber:
          type: string
          minLength: 1
          maxLength: 40
        specialty:
          type:
            - string
            - "null"
          maxLength: 120
        active:
          type: boolean
      required:
        - licenseNumber
    PatientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type:
            - string
            - "null"
        birthDate:
          type:
            - string
            - "null"
          format: date
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        emergencyContact:
          type:
            - string
            - "null"
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - documentType
        - documentNumber
        - birthDate
        - phone
        - email
        - address
        - emergencyContact
        - archivedAt
        - createdAt
    DocumentType:
      type: string
      enum:
        - DNI
        - LE
        - LC
        - PASAPORTE
        - OTRO
    CreatePatientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type:
            - string
            - "null"
          maxLength: 24
        birthDate:
          type:
            - string
            - "null"
          format: date
        phone:
          type:
            - string
            - "null"
          maxLength: 40
        email:
          type:
            - string
            - "null"
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        emergencyContact:
          type:
            - string
            - "null"
          maxLength: 200
      required:
        - firstName
        - lastName
    UpdatePatientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type:
            - string
            - "null"
          maxLength: 24
        birthDate:
          type:
            - string
            - "null"
          format: date
        phone:
          type:
            - string
            - "null"
          maxLength: 40
        email:
          type:
            - string
            - "null"
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        emergencyContact:
          type:
            - string
            - "null"
          maxLength: 200
    ClinicalEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entryType:
          type: string
          enum:
            - EVOLUTION
            - CORRECTION
        content:
          type: string
        correctionOfId:
          type:
            - string
            - "null"
          format: uuid
        appointmentId:
          type:
            - string
            - "null"
          format: uuid
        professional:
          type: object
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
          required:
            - id
            - displayName
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - entryType
        - content
        - correctionOfId
        - appointmentId
        - professional
        - createdAt
    CreateClinicalEntryInput:
      type: object
      properties:
        content:
          type: string
          minLength: 3
          maxLength: 10000
        appointmentId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - content
    CorrectClinicalEntryInput:
      type: object
      properties:
        content:
          type: string
          minLength: 3
          maxLength: 10000
      required:
        - content
    Practice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        defaultDurationMinutes:
          type: integer
        basePrice:
          type: string
          example: "25000.00"
          description: Importe en pesos con dos decimales
        active:
          type: boolean
      required:
        - id
        - code
        - name
        - defaultDurationMinutes
        - basePrice
        - active
    CreatePracticeInput:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9._-]{1,19}$
        name:
          type: string
          minLength: 2
          maxLength: 120
        defaultDurationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          default: 30
        basePrice:
          type: string
          pattern: ^(?!0+(\.0+)?$)\d{1,12}(\.\d{1,2})?$
      required:
        - code
        - name
        - basePrice
    UpdatePracticeInput:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9._-]{1,19}$
        name:
          type: string
          minLength: 2
          maxLength: 120
        defaultDurationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        basePrice:
          type: string
          pattern: ^(?!0+(\.0+)?$)\d{1,12}(\.\d{1,2})?$
        active:
          type: boolean
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - "null"
        cancellationReason:
          type:
            - string
            - "null"
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        patient:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
          required:
            - id
            - fullName
        professional:
          type: object
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            displayName:
              type: string
          required:
            - id
            - userId
            - displayName
        practice:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
          required:
            - id
            - code
            - name
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - startsAt
        - endsAt
        - notes
        - cancellationReason
        - branch
        - patient
        - professional
        - practice
        - createdAt
    AppointmentStatus:
      type: string
      enum:
        - SCHEDULED
        - CONFIRMED
        - ATTENDED
        - NO_SHOW
        - CANCELLED
    CreateAppointmentInput:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        practiceId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - "null"
          maxLength: 500
      required:
        - patientId
        - professionalId
        - branchId
        - startsAt
        - endsAt
    UpdateAppointmentInput:
      type: object
      properties:
        professionalId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        practiceId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - "null"
          maxLength: 500
    ChangeAppointmentStatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
            - CONFIRMED
            - ATTENDED
            - NO_SHOW
            - CANCELLED
        cancellationReason:
          type: string
          minLength: 3
          maxLength: 200
      required:
        - status
  parameters: {}
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio y base de datos operativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Error inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: El servicio responde pero la base de datos no
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Indica si la instalación todavía necesita configuración inicial
      responses:
        "200":
          description: Estado de la instalación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/setup:
    post:
      tags:
        - Setup
      summary: "Configuración inicial: organización, primera sede y primer
        administrador"
      description: Requiere el código de instalación que el servidor muestra en su log
        al arrancar sin configurar. Solo funciona una vez.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Instalación configurada; inicia sesión con el administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Código de instalación inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: La instalación ya está configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: La contraseña del administrador no cumple los requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Inicia sesión
      description: Limitado a 10 intentos fallidos cada 15 minutos por usuario e IP.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada; se emite la cookie sid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Cierra la sesión actual
      security: &a1
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Usuario de la sesión, con sus permisos efectivos y el token CSRF
      security: &a2
        - cookieAuth: []
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/change-password:
    post:
      tags:
        - Auth
      summary: Cambia la contraseña propia; cierra las demás sesiones del usuario
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: Contraseña actual incorrecta, igual a la actual o que no cumple los
            requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/onboarding/complete:
    post:
      tags:
        - Auth
      summary: Marca el tutorial inicial como completado
      security: *a1
      responses:
        "204":
          description: Registrado
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/users:
    get:
      tags: &a3
        - Usuarios
      summary: Lista los usuarios de la organización
      description: Requiere el permiso users:manage (rol Administrador).
      security: *a2
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
