          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: El recurso no existe (o pertenece a otra organización)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
