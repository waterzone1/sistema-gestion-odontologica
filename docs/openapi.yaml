openapi: 3.1.0
info:
  title: Sistema de Gestión Odontológica - API
  version: 0.2.0
  description: API REST del backend. Se autentica con una cookie de sesión
    HttpOnly. Las escrituras requieren el header Origin de la aplicación y el
    token CSRF de la sesión. Los errores siguen el formato ErrorBody.
servers:
  - url: /
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Usuarios
  - name: Sedes
  - name: Profesionales
  - name: Pacientes
  - name: Prácticas
  - name: Turnos
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Cookie de sesión HttpOnly que emite el login o el setup inicial
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token de la sesión (viene en la respuesta de login y de /auth/me).
        Las escrituras también exigen el header Origin de la app.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: degraded si alguna dependencia no responde
        db:
          type: string
          enum:
            - up
            - down
        uptimeSeconds:
          type: integer
          minimum: 0
      required:
        - status
        - db
        - uptimeSeconds
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: APPOINTMENT_CONFLICT
            message:
              type: string
              example: El profesional ya tiene un turno en ese horario
            details: {}
          required:
            - code
            - message
      required:
        - error
    SetupStatus:
      type: object
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
    SessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrfToken:
          type: string
          description: Enviar en el header X-CSRF-Token en toda escritura
      required:
        - user
        - csrfToken
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
            enum:
              - users:manage
              - branches:manage
              - professionals:manage
              - professionals:read
              - patients:read
              - patients:write
              - practices:read
              - practices:manage
              - appointments:read
              - appointments:manage
              - appointments:attend
              - clinical:read
              - clinical:write
              - services:read
              - services:write
              - services:void
              - account:read
              - payments:create
              - payments:void
              - services:price
              - billing:void-any-day
              - availability:manage
              - appointments:override
              - treatment:read
              - treatment:write
              - treatment:price
              - treatment:cancel
              - patient-notes:write
              - exchange-rate:manage
              - coverages:manage
              - liquidations:manage
              - audit:read
              - backups:manage
              - reports:read
              - organization:manage
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        mustChangePassword:
          type: boolean
        onboardingCompleted:
          type: boolean
        theme:
          $ref: "#/components/schemas/ThemePreference"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        modules:
          type: object
          properties:
            coverages:
              type: boolean
          required:
            - coverages
          description: Módulos que la organización tiene activados
      required:
        - id
        - username
        - displayName
        - roles
        - permissions
        - branchIds
        - mustChangePassword
        - onboardingCompleted
        - theme
        - preferences
        - modules
    Role:
      type: string
      enum:
        - ADMIN
        - DENTIST
        - RECEPTIONIST
    ThemePreference:
      type: string
      enum:
        - SYSTEM
        - LIGHT
        - DARK
    UserPreferences:
      type: object
      properties:
        menuOrder:
          type: array
          items:
            type: string
            pattern: ^\/[a-z/-]{0,60}$
          maxItems: 20
          description: Orden del menú, por ruta. Lo que no figura va al final
        homePage:
          type: string
          pattern: ^\/[a-z/-]{0,60}$
          description: Pantalla que se abre al entrar
        agendaView:
          type: string
          enum:
            - timeGridWeek
            - timeGridDay
            - listWeek
        agendaStartHour:
          type: integer
          minimum: 0
          maximum: 23
        agendaEndHour:
          type: integer
          minimum: 1
          maximum: 24
        agendaSlotMinutes:
          anyOf:
            - type: number
              enum:
                - 15
            - type: number
              enum:
                - 30
        showSaturday:
          type: boolean
        showSunday:
          type: boolean
        toursSeen:
          type: array
          items:
            type: string
            pattern: ^[a-z-]{1,40}$
          maxItems: 40
          description: Recorridos guiados que el usuario ya vio
      required:
        - menuOrder
        - homePage
        - agendaView
        - agendaStartHour
        - agendaEndHour
        - agendaSlotMinutes
        - showSaturday
        - showSunday
        - toursSeen
    SetupInput:
      type: object
      properties:
        setupToken:
          type: string
          minLength: 1
          maxLength: 200
        organization:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            timezone:
              type: string
              default: America/Argentina/Buenos_Aires
          required:
            - name
        branch:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            address:
              type:
                - string
                - "null"
              maxLength: 200
            phone:
              type:
                - string
                - "null"
              maxLength: 200
          required:
            - name
        admin:
          type: object
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 64
              pattern: ^[a-z0-9._-]+$
            displayName:
              type: string
              minLength: 2
              maxLength: 120
            password:
              type: string
              maxLength: 256
          required:
            - username
            - displayName
            - password
      required:
        - setupToken
        - organization
        - branch
        - admin
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - username
        - password
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          maxLength: 256
      required:
        - currentPassword
        - newPassword
    PreferencesInput:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreference"
        preferences:
          type: object
          properties:
            menuOrder:
              type: array
              items:
                type: string
                pattern: ^\/[a-z/-]{0,60}$
              maxItems: 20
              description: Orden del menú, por ruta. Lo que no figura va al final
            homePage:
              type: string
              pattern: ^\/[a-z/-]{0,60}$
              description: Pantalla que se abre al entrar
            agendaView:
              type: string
              enum:
                - timeGridWeek
                - timeGridDay
                - listWeek
            agendaStartHour:
              type: integer
              minimum: 0
              maximum: 23
            agendaEndHour:
              type: integer
              minimum: 1
              maximum: 24
            agendaSlotMinutes:
              anyOf:
                - type: number
                  enum:
                    - 15
                - type: number
                  enum:
                    - 30
            showSaturday:
              type: boolean
            showSunday:
              type: boolean
            toursSeen:
              type: array
              items:
                type: string
                pattern: ^[a-z-]{1,40}$
              maxItems: 40
              description: Recorridos guiados que el usuario ya vio
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        professional:
          $ref: "#/components/schemas/ProfessionalSummary"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - displayName
        - active
        - mustChangePassword
        - roles
        - branchIds
        - professional
        - createdAt
    ProfessionalSummary:
      type:
        - object
        - "null"
      properties:
        licenseNumber:
          type: string
        active:
          type: boolean
      required:
        - licenseNumber
        - active
    CreateUserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9._-]+$
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        password:
          type: string
          maxLength: 256
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
          maxItems: 3
        branchIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          default: []
      required:
        - username
        - displayName
        - password
        - roles
    UpdateUserInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
          maxItems: 3
        branchIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
    ResetPasswordInput:
      type: object
      properties:
        password:
          type: string
          maxLength: 256
      required:
        - password
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        active:
          type: boolean
      required:
        - id
        - name
        - address
        - phone
        - active
    CreateBranchInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        phone:
          type:
            - string
            - "null"
          maxLength: 200
      required:
        - name
    UpdateBranchInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
        phone:
          type:
            - string
            - "null"
          maxLength: 200
        active:
          type: boolean
    Professional:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        licenseNumber:
          type: string
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        color:
          $ref: "#/components/schemas/ProfessionalColor"
        practiceIds:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
        branchIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - id
        - userId
        - displayName
        - licenseNumber
        - phone
        - email
        - color
        - practiceIds
        - active
        - branchIds
    ProfessionalColor:
      type:
        - string
        - "null"
      enum:
        - teal
        - blue
        - indigo
        - violet
        - pink
        - red
        - orange
        - amber
        - green
        - slate
        - null
      description: Color con el que se lo identifica en la agenda
    SaveProfessionalInput:
      type: object
      properties:
        licenseNumber:
          type: string
          minLength: 1
          maxLength: 40
        phone:
          type:
            - string
            - "null"
          maxLength: 40
        email:
          type:
            - string
            - "null"
          maxLength: 120
        color:
          $ref: "#/components/schemas/ProfessionalColor"
        practiceIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          description: "Prácticas que realiza. Vacío: puede recibir turnos de cualquier
            práctica"
        active:
          type: boolean
      required:
        - licenseNumber
    PatientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type:
            - string
            - "null"
        birthDate:
          type:
            - string
            - "null"
          format: date
        phone:
          type:
            - string
            - "null"
        phoneHasWhatsapp:
          type: boolean
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - documentType
        - documentNumber
        - birthDate
        - phone
        - phoneHasWhatsapp
        - email
        - address
        - archivedAt
        - createdAt
    DocumentType:
      type: string
      enum:
        - DNI
        - LE
        - LC
        - PASAPORTE
        - OTRO
    CreatePatientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          minLength: 1
          maxLength: 24
        birthDate:
          type: string
          format: date
        phone:
          type:
            - string
            - "null"
          maxLength: 40
        phoneHasWhatsapp:
          type: boolean
          default: true
          description: Si el teléfono usa WhatsApp. Sin WhatsApp, el recordatorio se avisa
            por llamada
        email:
          type:
            - string
            - "null"
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
      required:
        - firstName
        - lastName
        - documentNumber
        - birthDate
    UpdatePatientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          minLength: 1
          maxLength: 24
        birthDate:
          type: string
          format: date
        phone:
          type:
            - string
            - "null"
          maxLength: 40
        phoneHasWhatsapp:
          type: boolean
          description: Si el teléfono usa WhatsApp. Sin WhatsApp, el recordatorio se avisa
            por llamada
        email:
          type:
            - string
            - "null"
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 200
    ArchivePatientInput:
      type: object
      properties:
        cancelActiveAppointments:
          type: boolean
          default: false
    PatientNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
          required:
            - id
            - displayName
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - content
        - author
        - createdAt
        - archivedAt
    CreatePatientNoteInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - content
    PatientImportPreview:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              firstName:
                type: string
              lastName:
                type: string
              documentType:
                type: string
              documentNumber:
                type: string
              birthDate:
                type: string
              errors:
                type: array
                items:
                  type: string
            required:
              - line
              - firstName
              - lastName
              - documentType
              - documentNumber
              - birthDate
              - errors
        valid:
          type: integer
        invalid:
          type: integer
      required:
        - rows
        - valid
        - invalid
    PatientImportInput:
      type: object
      properties:
        csv:
          type: string
          minLength: 1
          maxLength: 1000000
      required:
        - csv
    PatientImportResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
      required:
        - created
        - skipped
    ProfessionalAvailability:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityRule"
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityException"
      required:
        - rules
        - exceptions
    AvailabilityRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        weekday:
          type: integer
        start:
          type: string
          example: 09:00
        end:
          type: string
          example: 13:00
      required:
        - id
        - branchId
        - weekday
        - start
        - end
    AvailabilityException:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AvailabilityExceptionType"
        branchId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - id
        - type
        - branchId
        - startsAt
        - endsAt
        - reason
    AvailabilityExceptionType:
      type: string
      enum:
        - BLOCK
        - VACATION
        - ABSENCE
        - EXTRA
    ReplaceAvailabilityRulesInput:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              branchId:
                type: string
                format: uuid
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 = lunes … 7 = domingo
              start:
                type: string
                pattern: ^(([01]\d|2[0-3]):[0-5]\d|24:00)$
              end:
                type: string
                pattern: ^(([01]\d|2[0-3]):[0-5]\d|24:00)$
            required:
              - branchId
              - weekday
              - start
              - end
          maxItems: 100
      required:
        - rules
    AvailabilityExceptionResult:
      type: object
      properties:
        exception:
          $ref: "#/components/schemas/AvailabilityException"
        conflicts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              startsAt:
                type: string
                format: date-time
              patient:
                type: string
            required:
              - id
              - startsAt
              - patient
          description: Turnos activos que quedan dentro de un bloqueo y conviene reprogramar
      required:
        - exception
        - conflicts
    CreateAvailabilityExceptionInput:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/AvailabilityExceptionType"
        branchId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 200
      required:
        - type
        - startsAt
        - endsAt
        - reason
    AgendaAvailability:
      type: array
      items:
        type: object
        properties:
          professionalId:
            type: string
            format: uuid
          available:
            type: array
            items:
              type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                branchId:
                  type:
                    - string
                    - "null"
                  format: uuid
              required:
                - start
                - end
                - branchId
          blocked:
            type: array
            items:
              type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                branchId:
                  type:
                    - string
                    - "null"
                  format: uuid
                type:
                  $ref: "#/components/schemas/AvailabilityExceptionType"
                reason:
                  type: string
              required:
                - start
                - end
                - branchId
                - type
                - reason
        required:
          - professionalId
          - available
          - blocked
    PerformedService:
      type: object
      properties:
        id:
          type: string
          format: uuid
        practice:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
          required:
            - id
            - code
            - name
        professional:
          type: object
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
          required:
            - id
            - displayName
        appointmentId:
          type:
            - string
            - "null"
          format: uuid
        treatmentItemId:
          type:
            - string
            - "null"
          format: uuid
        tooth:
          type:
            - integer
            - "null"
          description: Nulo para quien no accede a datos clínicos
        surfaces:
          type: array
          items:
            type: string
            enum:
              - M
              - D
              - V
              - L
              - O
        price:
          type:
            - string
            - "null"
          example: "25000.00"
          description: A cargo del paciente (si hay cobertura, el coseguro). Nulo para
            quien no puede ver importes
        coverageAmount:
          type:
            - string
            - "null"
          example: "25000.00"
          description: A cargo de la cobertura, pendiente de liquidar
        coverage:
          type:
            - object
            - "null"
          properties:
            provider:
              type: string
            plan:
              type: string
            affiliateNumber:
              type: string
          required:
            - provider
            - plan
            - affiliateNumber
        authorizationCode:
          type:
            - string
            - "null"
        catalogPrice:
          type:
            - string
            - "null"
          example: "25000.00"
          description: Precio del catálogo al registrarla
        paid:
          type:
            - string
            - "null"
          example: "25000.00"
          description: Importe cubierto por pagos vigentes
        pending:
          type:
            - string
            - "null"
          example: "25000.00"
          description: Importe que falta pagar
        performedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ACTIVE
            - VOIDED
        voidReason:
