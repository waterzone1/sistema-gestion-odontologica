  parameters: {}
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio y base de datos operativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Error inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: El servicio responde pero la base de datos no
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Indica si la instalación todavía necesita configuración inicial
      responses:
        "200":
          description: Estado de la instalación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/setup:
    post:
      tags:
        - Setup
      summary: "Configuración inicial: organización, primera sede y primer
        administrador"
      description: Requiere el código de instalación que el servidor muestra en su log
        al arrancar sin configurar. Solo funciona una vez.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Instalación configurada; inicia sesión con el administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Código de instalación inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: La instalación ya está configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: La contraseña del administrador no cumple los requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Inicia sesión
      description: Limitado a 10 intentos fallidos cada 15 minutos por usuario e IP.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada; se emite la cookie sid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Cierra la sesión actual
      security: &a1
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Usuario de la sesión, con sus permisos efectivos y el token CSRF
      security: &a2
        - cookieAuth: []
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/change-password:
    post:
      tags:
        - Auth
      summary: Cambia la contraseña propia; cierra las demás sesiones del usuario
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: Contraseña actual incorrecta, igual a la actual o que no cumple los
            requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/preferences:
    put:
      tags:
        - Auth
      summary: Guarda las preferencias del usuario (tema claro, oscuro o del sistema)
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "204":
          description: Guardado
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/onboarding/complete:
    post:
      tags:
        - Auth
      summary: Marca el tutorial inicial como completado
      security: *a1
      responses:
        "204":
          description: Registrado
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/users:
    get:
      tags: &a3
        - Usuarios
      summary: Lista los usuarios de la organización
      description: Requiere el permiso users:manage (rol Administrador).
      security: *a2
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: *a3
      summary: Crea un usuario con una contraseña temporal
      description: El usuario debe cambiar la contraseña en su primer ingreso.
        Odontólogos y recepción necesitan al menos una sede.
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
