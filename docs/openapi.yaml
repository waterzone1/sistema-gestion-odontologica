          pattern: ^(?!0+(\.0+)?$)\d{1,12}(\.\d{1,2})?$
        active:
          type: boolean
    CreateAppointmentInput:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        practiceId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - "null"
          maxLength: 500
        override:
          type: object
          properties:
            reason:
              type: string
              minLength: 5
              maxLength: 300
          required:
            - reason
          description: "Solo administración: permite dar el turno aunque el profesional
            esté de vacaciones, ausente o bloqueado. Nunca permite superponer
            turnos"
        acknowledgeWarnings:
          type: boolean
          description: Confirma que se da el turno aunque esté fuera del horario del
            profesional o con una práctica que no tiene habilitada
      required:
        - patientId
        - professionalId
        - branchId
        - startsAt
        - endsAt
    UpdateAppointmentInput:
      type: object
      properties:
        professionalId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        practiceId:
          type:
            - string
            - "null"
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - "null"
          maxLength: 500
        override:
          type: object
          properties:
            reason:
              type: string
              minLength: 5
              maxLength: 300
          required:
            - reason
          description: "Solo administración: permite dar el turno aunque el profesional
            esté de vacaciones, ausente o bloqueado. Nunca permite superponer
            turnos"
        acknowledgeWarnings:
          type: boolean
          description: Confirma que se da el turno aunque esté fuera del horario del
            profesional o con una práctica que no tiene habilitada
    ChangeAppointmentStatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
            - CONFIRMED
            - ATTENDED
            - NO_SHOW
            - CANCELLED
        cancellationReason:
          type: string
          minLength: 3
          maxLength: 200
      required:
        - status
    ReactivateAppointmentInput:
      type: object
      properties:
        acknowledgeWarnings:
          type: boolean
          description: Confirma que se da el turno aunque esté fuera del horario del
            profesional o con una práctica que no tiene habilitada
        override:
          type: object
          properties:
            reason:
              type: string
              minLength: 5
              maxLength: 300
          required:
            - reason
          description: "Solo administración: permite dar el turno aunque el profesional
            esté de vacaciones, ausente o bloqueado. Nunca permite superponer
            turnos"
    CloseAppointmentInput:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - TREATMENT_SESSION
            treatmentItemId:
              type: string
              format: uuid
          required:
            - kind
            - treatmentItemId
        - type: object
          properties:
            kind:
              type: string
              enum:
                - NO_CHARGE
            reason:
              type: string
              minLength: 3
              maxLength: 200
          required:
            - kind
            - reason
  parameters: {}
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio y base de datos operativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Error inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: El servicio responde pero la base de datos no
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Indica si la instalación todavía necesita configuración inicial
      responses:
        "200":
          description: Estado de la instalación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/setup:
    post:
      tags:
        - Setup
      summary: "Configuración inicial: organización, primera sede y primer
        administrador"
      description: Requiere el código de instalación que el servidor muestra en su log
        al arrancar sin configurar. Solo funciona una vez.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Instalación configurada; inicia sesión con el administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Código de instalación inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: La instalación ya está configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: La contraseña del administrador no cumple los requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Inicia sesión
      description: Limitado a 10 intentos fallidos cada 15 minutos por usuario e IP.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada; se emite la cookie sid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Cierra la sesión actual
      security: &a1
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Usuario de la sesión, con sus permisos efectivos y el token CSRF
      security: &a2
        - cookieAuth: []
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/change-password:
    post:
      tags:
        - Auth
      summary: Cambia la contraseña propia; cierra las demás sesiones del usuario
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: Contraseña actual incorrecta, igual a la actual o que no cumple los
            requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/preferences:
    put:
      tags:
        - Auth
      summary: Guarda las preferencias del usuario
      description: Tema, orden del menú, pantalla de inicio y cómo se ve la agenda.
        Solo se pueden ocultar sábados o domingos si ningún profesional activo
        atiende ese día.
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "204":
          description: Guardado
        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Sin sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Sin permiso, o falla la verificación CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: Horario de agenda inválido o un profesional atiende el día que se
